[package]
name = "p2p-tunnler"
version = "0.2.0"
description = "A peer-to-peer tunnler using OpenDHT for ip exchange, for example for wireguard connections"
license = "LGPL-2.1+"
authors = ["Idan Dor <>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bytes = "1.12"
slog = { version = "2.8", features = ["max_level_debug"] }
slog-async = "2.8"
slog-term = "2.9"
base64 = "0.22"
futures = "0.3.8"
crypto_box = "0.9.1"
byteorder = "1.5"
rand = "0.10"
socket2 = "0.6"


async-broadcast = "0.7"
crab_nat = "0.8.1"
igd-next = "0.17.1"
libc = "0.2"
tokio = { version = "1.53", features = ["rt", "net", "sync", "time"] }

# opendht = { path = "../opendht-rs" }
opendht = { git = "https://github.com/IdanDor/opendht.git" }
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
